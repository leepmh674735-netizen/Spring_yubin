# [1] 애플리케이션 및 서버 설정
spring.application.name=kosmo_post-1
server.port=80

# [2] View (JSP) 설정
spring.mvc.view.prefix=/WEB-INF/views/account/
spring.mvc.view.suffix=.jsp

# [3] DB 정보 (PostgreSQL - Supabase)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.zvbgzlbhwjxrtmqdvrjw}
spring.datasource.password=${DB_PASSWORD:UQBv8xlW0QMdnxeN}

# DB 초기화 비활성화 (원격 DB 보호)
spring.sql.init.mode=never

# [4] MyBatis 설정
# 별칭(Alias) 설정을 통해 XML에서 클래스명만 사용 가능
mybatis.type-aliases-package=com.winter.yubin
# DB의 언더바(_) 컬럼명을 자바의 낙타표기법(camelCase)으로 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# [5] 파일 업로드 (Multipart) 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# [6] 파일 저장 및 커스텀 경로 관리
yubin.upload.base=C:/upload/
yubin.upload.url=/files/**
yubin.upload.path=file:///C:/upload/

yubin.account=account
yubin.aop.test=aop.test
yubin.board.notice=notice
yubin.board.qna=qna
yubin.cart=cart
yubin.config=config
yubin.file=file
yubin.interceptors=interceptors
yubin.member=member
yubin.pager=pager
yubin.product=product
yubin.review=review

# app.* 호환용 설정
app.member=member
app.product=product
app.board.notice=notice
app.upload.base=C:/upload/

# [7] AOP 설정
spring.aop.proxy-target-class=true