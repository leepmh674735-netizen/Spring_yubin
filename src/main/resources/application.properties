# [1] 애플리케이션 및 서버 설정
spring.application.name=kosmo_post-1
server.port=80

# [2] View (JSP) 설정
spring.mvc.view.prefix=/WEB-INF/views/account/
spring.mvc.view.suffix=.jsp

# [3] DB 정보 (H2 인메모리 데이터베이스 - 로컬 데모 구동용)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# H2 Console 설정 (http://localhost/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 스키마 초기화 설정
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# [4] MyBatis 설정
# 별칭(Alias) 설정을 통해 XML에서 클래스명만 사용 가능
mybatis.type-aliases-package=com.winter.yubin
# DB의 언더바(_) 컬럼명을 자바의 낙타표기법(camelCase)으로 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# [5] 파일 업로드 (Multipart) 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# [6] 파일 저장 및 커스텀 경로 관리
yubin.upload.base=C:/upload/
yubin.upload.url=/files/**
yubin.upload.path=file:///C:/upload/

yubin.account=account
yubin.aop.test=aop.test
yubin.board.notice=notice
yubin.board.qna=qna
yubin.cart=cart
yubin.config=config
yubin.file=file
yubin.interceptors=interceptors
yubin.member=member
yubin.pager=pager
yubin.product=product
yubin.review=review

# app.* 호환용 설정
app.member=member
app.product=product
app.board.notice=notice
app.upload.base=C:/upload/

# [7] AOP 설정
spring.aop.proxy-target-class=true